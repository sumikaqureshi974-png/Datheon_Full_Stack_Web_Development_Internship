<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager - DT-2026-24BIU - Sumika Qureshi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
body{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;min-height:100vh;padding:20px}
.container{max-width:800px;margin:auto;background:rgba(30,41,59,0.9);padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{text-align:center;color:#38bdf8;margin-bottom:5px}
.info{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{flex:1;background:#0f172a;padding:12px;border-radius:10px;text-align:center}
.stat b{color:#38bdf8;font-size:20px;display:block}
.input-box{display:flex;gap:10px;margin-bottom:15px}
input,select{flex:1;padding:12px;border-radius:8px;border:none;outline:none;background:#0f172a;color:#fff}
button{padding:12px 18px;border:none;border-radius:8px;background:#38bdf8;color:#000;font-weight:bold;cursor:pointer}
.filter-bar{display:flex;gap:8px;margin-bottom:15px}
.filter-bar button{background:#334155;color:#fff;font-size:12px;padding:8px 12px}
.filter-bar button.active{background:#38bdf8;color:#000}
.task{background:#0f172a;padding:12px 15px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #38bdf8}
.task.done{opacity:0.5;border-left-color:#22c55e}
.task.done span{text-decoration:line-through}
.actions button{margin-left:5px;padding:6px 10px;font-size:12px}
.del{background:#ef4444;color:#fff} .done-btn{background:#22c55e;color:#fff} .edit{background:#f59e0b;color:#fff}
</style>
</head>
<body>
<div class="container">
<h1>Dynamic Task Manager</h1>
<p class="info">DT-2026-24BIU | Sumika Qureshi | sumikaqureshi974@gmail.com</p>
<div class="stats"><div class="stat"><b id="total">0</b>Total</div><div class="stat"><b id="done">0</b>Completed</div><div class="stat"><b id="pending">0</b>Pending</div></div>
<div class="input-box"><input id="taskInput" placeholder="Enter new task..."><select id="priority"><option>High</option><option>Medium</option><option>Low</option></select><button onclick="addTask()">Add</button></div>
<div class="filter-bar"><button class="active" onclick="filterTask('all',this)">All</button><button onclick="filterTask('pending',this)">Pending</button><button onclick="filterTask('done',this)">Completed</button></div>
<div id="taskList"></div>
</div>
<script>
let tasks=JSON.parse(localStorage.getItem('datheon_tasks')||'[]'), filter='all';
function save(){localStorage.setItem('datheon_tasks',JSON.stringify(tasks)); render();}
function render(){
 let list=document.getElementById('taskList'); list.innerHTML=''; let t=0,d=0;
 let filtered=tasks.filter((x,i)=>{if(filter==='done')return x.done; if(filter==='pending')return !x.done; return true;});
 filtered.forEach((task,idx)=>{
  let realIdx=tasks.indexOf(task); list.innerHTML+=`<div class="task ${task.done?'done':''}"><span>[${task.priority}] ${task.text}</span><div class="actions"><button class="done-btn" onclick="toggle(${realIdx})">${task.done?'Undo':'Done'}</button><button class="edit" onclick="editTask(${realIdx})">Edit</button><button class="del" onclick="del(${realIdx})">Delete</button></div></div>`;
 });
 tasks.forEach(x=>{t++; if(x.done)d++;});
 document.getElementById('total').innerText=t; document.getElementById('done').innerText=d; document.getElementById('pending').innerText=t-d;
}
function addTask(){let inp=document.getElementById('taskInput'), p=document.getElementById('priority'); if(!inp.value.trim())return; tasks.push({text:inp.value,priority:p.value,done:false}); inp.value=''; save();}
function toggle(i){tasks[i].done=!tasks[i].done; save();}
function del(i){if(confirm('Delete task?')){tasks.splice(i,1); save();}}
function editTask(i){let nt=prompt('Edit task:',tasks[i].text); if(nt){tasks[i].text=nt; save();}}
function filterTask(f,btn){filter=f; document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render();}
render();
</script>
</body>
</html>
